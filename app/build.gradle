apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "ohi.andre.consolelauncher"
    compileSdk 34

    signingConfigs {
        create("debugConfig") {
            storeFile = file("${rootDir}/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.aistudio.consolelauncher.tuiapp"
        minSdk 26
        targetSdk 34
        versionCode 301
        versionName "v6.15.1-updated-v2"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.getByName("debugConfig")
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.getByName("debugConfig")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lint {
        checkReleaseBuilds false
    }

    splits {
        abi {
            enable false
        }
    }

    // Automatically names APKs as: name-cpu_build-tag.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 1. Base name for your application file
            def appName = "consolelauncher"
            
            // 2. Detect the CPU target build type
            def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
            if (abiFilter == null) {
                abiFilter = "universal"
            }
            
            // 3. Fallback to versionName if GITHUB_REF_NAME property isn't explicitly passed
            def tagVersion = project.hasProperty('GITHUB_REF_NAME') ? project.property('GITHUB_REF_NAME') : variant.versionName

            // 4. Force structural name mapping format
            outputFileName = "${appName}-${abiFilter}-${tagVersion}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'it.andreuzzi:CompareString2:1.0.9'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation('com.cronutils:cron-utils:9.2.1') {
        exclude group: 'org.javassist', module: 'javassist'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    
    // Google AI SDK (Gemini)
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'com.google.guava:guava:33.0.0-android'
    
    // Markdown Rendering
    implementation 'io.noties.markwon:core:4.6.2'
}
