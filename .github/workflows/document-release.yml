name: Generate & Update Release Documentation

on:
  release:
    types: [published] # Triggers immediately following the build release completion
  workflow_dispatch: # Allows manual trigger to recalculate logs at any time

permissions:
  contents: write

jobs:
  Update-Notes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Existing Release Assets for Calculations
      run: |
        mkdir -p release_assets
        cd release_assets
        gh release download "${{ github.event.release.tag_name || github.ref_name }}" --pattern "*.apk" --clobber || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Notes Markdown
      run: |
        CHANGELOG_PATH="$GITHUB_WORKSPACE/fix-bug.md"
        cd release_assets || mkdir -p release_assets && cd release_assets
        
        calc_size() {
          local file=$1
          if [ -f "$file" ]; then ls -lh "$file" | awk '{print $5}'; else echo "N/A"; fi
        }
        
        calc_sha() {
          local file=$1
          if [ -f "$file" ]; then sha256sum "$file" | awk '{print $1}'; else echo "N/A"; fi
        }

        UNIVERSAL_NAME=$(ls *universal*.apk 2>/dev/null | head -n 1)
        ARM64_NAME=$(ls *arm64-v8a*.apk 2>/dev/null | head -n 1)
        ARMV7_NAME=$(ls *armeabi-v7a*.apk 2>/dev/null | head -n 1)
        X86_NAME=$(ls *x86_64*.apk 2>/dev/null | head -n 1)

        UNIV_STR="${UNIVERSAL_NAME:-universal-release.apk}"
        ARM64_STR="${ARM64_NAME:-arm64-v8a-release.apk}"
        ARMV7_STR="${ARMV7_NAME:-armeabi-v7a-release.apk}"
        X86_STR="${X86_64_NAME:-x86_64-release.apk}"

        UNIV_SIZE=$(calc_size "$UNIVERSAL_NAME")
        UNIV_SHA=$(calc_sha "$UNIVERSAL_NAME")
        ARM64_SIZE=$(calc_size "$ARM64_NAME")
        ARM64_SHA=$(calc_sha "$ARM64_NAME")
        ARMV7_SIZE=$(calc_size "$ARMV7_NAME")
        ARMV7_SHA=$(calc_sha "$ARMV7_NAME")
        X86_SIZE=$(calc_size "$X86_NAME")
        X86_SHA=$(calc_sha "$X86_NAME")
        TUI_SIZE=$(calc_size "tui.apk")
        TUI_SHA=$(calc_sha "tui.apk")
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
        TARGET_TAG="${{ github.event.release.tag_name || github.ref_name }}"

        cat << 'EOF' > ../body.md
### 🚀 Automated Build Details

*   **Release Tag:** `__TAG_NAME__`
*   **Commit Reference:** `__COMMIT_SHA__`
*   **Triggered By:** @`__ACTOR__`
*   **Build Timestamp:** __TIMESTAMP__
*   **Pipeline Source:** [Job Run](__SERVER_URL__/__REPOSITORY__/actions/runs/__RUN_ID__)

---

### 🛠️ Developer Notes & Architecture Breakdown

This production-ready release contains separate APK variants optimized for distinct CPU architectures alongside a fallback universal variant. Splitting the builds reduces the download size and installation footprint for end-users.

| Variant Asset Name | Target Architecture | Build Size | SHA-256 Checksum Verification |
| :--- | :--- | :--- | :--- |
| `__UNIV_STR__` | All ABIs (Universal) | `__UNIV_SIZE__` | `__UNIV_SHA__` |
| `__ARM64_STR__` | Modern 64-bit ARM | `__ARM64_SIZE__` | `__ARM64_SHA__` |
| `__ARMV7_STR__` | Legacy 32-bit ARM | `__ARMV7_SIZE__` | `__ARMV7_SHA__` |
| `__X86_STR__` | 64-bit Intel/AMD Emulators | `__X86_SIZE__` | `__X86_SHA__` |
| `tui.apk` | In-App System Overrides | `__TUI_SIZE__` | `__TUI_SHA__` |

> 💡 **Notice on `tui.apk`:** This asset is structurally identical to the Universal layout, tailored explicitly for downstream dynamic validation routines executed via the `tui -app_update` module interface.
EOF

        sed -i "s|__TAG_NAME__|${TARGET_TAG}|g" ../body.md
        sed -i "s|__COMMIT_SHA__|${{ github.sha }}|g" ../body.md
        sed -i "s|__ACTOR__|${{ github.actor }}|g" ../body.md
        sed -i "s|__TIMESTAMP__|${TIMESTAMP}|g" ../body.md
        sed -i "s|__SERVER_URL__|${{ github.server_url }}|g" ../body.md
        sed -i "s|__REPOSITORY__|${{ github.repository }}|g" ../body.md
        sed -i "s|__RUN_ID__|${{ github.run_id }}|g" ../body.md
        sed -i "s|__UNIV_STR__|${UNIV_STR}|g" ../body.md
        sed -i "s|__UNIV_SIZE__|${UNIV_SIZE}|g" ../body.md
        sed -i "s|__UNIV_SHA__|${UNIV_SHA}|g" ../body.md
        sed -i "s|__ARM64_STR__|${ARM64_STR}|g" ../body.md
        sed -i "s|__ARM64_SIZE__|${ARM64_SIZE}|g" ../body.md
        sed -i "s|__ARM64_SHA__|${ARM64_SHA}|g" ../body.md
        sed -i "s|__ARMV7_STR__|${ARMV7_STR}|g" ../body.md
        sed -i "s|__ARMV7_SIZE__|${ARMV7_SIZE}|g" ../body.md
        sed -i "s|__ARMV7_SHA__|${ARMV7_SHA}|g" ../body.md
        sed -i "s|__X86_STR__|${X86_STR}|g" ../body.md
        sed -i "s|__X86_SIZE__|${X86_SIZE}|g" ../body.md
        sed -i "s|__X86_SHA__|${X86_SHA}|g" ../body.md
        sed -i "s|__TUI_SIZE__|${TUI_SIZE}|g" ../body.md
        sed -i "s|__TUI_SHA__|${TUI_SHA}|g" ../body.md

        if [ -s "$CHANGELOG_PATH" ]; then
          cat << 'EOF' >> ../body.md

---

### ✨ New Features & Bug Fixes
EOF
          cat "$CHANGELOG_PATH" >> ../body.md
        fi

        cat << 'EOF' >> ../body.md

---

### 📝 Changelog Summary

For full update details, granular diffs, and precise commit history, please review the automated deployment logs:
🔗 **[View Complete Commit History](__SERVER_URL__/__REPOSITORY__/commits/__TAG_NAME__)**

---

### 📥 Deployment & Installation Guide

1.  **Identify Architecture:** Determine your device's CPU architecture using an info app or the universal installer.
2.  **Allow Unknown Sources:** Navigate to `Settings` > `Security` > `Install Unknown Apps` and enable permission for your browser/file manager.
3.  **Install:** Download the matching variant above and execute the package installer.
EOF

        sed -i "s|__SERVER_URL__|${{ github.server_url }}|g" ../body.md
        sed -i "s|__REPOSITORY__|${{ github.repository }}|g" ../body.md
        sed -i "s|__TAG_NAME__|${TARGET_TAG}|g" ../body.md

    - name: Push Dynamic Documentation Updates to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        body_path: body.md
        append_body: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
