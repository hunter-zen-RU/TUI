name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0

permissions:
  contents: write # Required for creating a release and uploading assets

jobs:
  Gradle:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Generate debug keystore for Android signing
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK
      # Passes the Git tag to Gradle and caps workers to safeguard runner memory
      run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.workers.max=2 -PGITHUB_REF_NAME="${{ github.ref_name }}"

    - name: Extract Release Notes
      id: release_notes
      run: |
        echo "### 🚀 Automated Build Details" > body.md
        echo "" >> body.md
        echo "* **Tag Version:** ${{ github.ref_name }}" >> body.md
        echo "* **Commit SHA:** \`${{ github.sha }}\`" >> body.md
        echo "* **Triggered By:** @${{ github.actor }}" >> body.md
        echo "* **Build Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> body.md
        echo "" >> body.md
        echo "### 🛠️ Developer Notes" >> body.md
        echo "This production-ready release contains separate APK variants optimized for distinct CPU architectures alongside a fallback universal variant." >> body.md
        echo "" >> body.md
        echo "### 📝 Changelog Summary" >> body.md
        echo "For full update details and commit history, please review the [commit logs](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})." >> body.md

    - name: Create Release and Upload APKs
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        body_path: body.md
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
