name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write # Required for creating a release and uploading assets

jobs:
  Build-Release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Generate debug keystore for Android signing
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.workers.max=2 -PGITHUB_REF_NAME="${{ github.ref_name }}"

    - name: Create tui.apk copy from Universal APK
      run: |
        cd app/build/outputs/apk/release/
        # Finds the generated universal APK file and copies it to tui.apk
        UNIVERSAL_FILE=$(ls *universal*.apk 2>/dev/null | head -n 1)
        if [ -f "$UNIVERSAL_FILE" ]; then
          cp "$UNIVERSAL_FILE" tui.apk
          echo "Successfully copied $UNIVERSAL_FILE to tui.apk"
        else
          echo "Error: Universal APK not found!" && exit 1
        fi

    - name: Extract Release Notes and Generate Checksums
      id: release_notes
      run: |
        CHANGELOG_PATH="$GITHUB_WORKSPACE/fix-bug.md"

        cd app/build/outputs/apk/release/
        
        # Core dynamic calculations for artifact table
        calc_size() {
          local file=$1
          if [ -n "$file" ] && [ -f "$file" ]; then
            ls -lh "$file" | awk '{print $5}'
          else
            echo "N/A"
          fi
        }
        
        calc_sha() {
          local file=$1
          if [ -n "$file" ] && [ -f "$file" ]; then
            sha256sum "$file" | awk '{print $1}'
          else
            echo "N/A"
          fi
        }

        # Find architecture filenames dynamically
        UNIVERSAL_NAME=$(ls *universal*.apk 2>/dev/null | head -n 1)
        ARM64_NAME=$(ls *arm64-v8a*.apk 2>/dev/null | head -n 1)
        ARMV7_NAME=$(ls *armeabi-v7a*.apk 2>/dev/null | head -n 1)
        X86_NAME=$(ls *x86_64*.apk 2>/dev/null | head -n 1)

        UNIV_STR="${UNIVERSAL_NAME:-universal-release.apk}"
        ARM64_STR="${ARM64_NAME:-arm64-v8a-release.apk}"
        ARMV7_STR="${ARMV7_NAME:-armeabi-v7a-release.apk}"
        X86_STR="${X86_NAME:-x86_64-release.apk}"

        UNIVERSAL_SIZE=$(calc_size "$UNIVERSAL_NAME")
        UNIVERSAL_SHA=$(calc_sha "$UNIVERSAL_NAME")
        ARM64_SIZE=$(calc_size "$ARM64_NAME")
        ARM64_SHA=$(calc_sha "$ARM64_NAME")
        ARMV7_SIZE=$(calc_size "$ARMV7_NAME")
        ARMV7_SHA=$(calc_sha "$ARMV7_NAME")
        X86_SIZE=$(calc_size "$X86_NAME")
        X86_SHA=$(calc_sha "$X86_NAME")
        TUI_SIZE=$(calc_size "tui.apk")
        TUI_SHA=$(calc_sha "tui.apk")
        BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

        # Assemble markdown output
        cat << EOF > ../../../../../body.md
### 🚀 Automated Build Details

*   **Release Tag:** \`${{ github.ref_name }}\`
*   **Commit Reference:** \`${{ github.sha }}\`
*   **Triggered By:** @\`${{ github.actor }}\`
*   **Build Timestamp:** ${BUILD_TIME}
*   **Pipeline Source:** [Job Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

---

### 🛠️ Developer Notes & Architecture Breakdown

This production-ready release contains separate APK variants optimized for distinct CPU architectures alongside a fallback universal variant. Splitting the builds reduces the download size and installation footprint for end-users.

| Variant Asset Name | Target Architecture | Build Size | SHA-256 Checksum Verification |
| :--- | :--- | :--- | :--- |
| \`${UNIV_STR}\` | All ABIs (Universal) | \`${UNIVERSAL_SIZE}\` | \`${UNIVERSAL_SHA}\` |
| \`${ARM64_STR}\` | Modern 64-bit ARM | \`${ARM64_SIZE}\` | \`${ARM64_SHA}\` |
| \`${ARMV7_STR}\` | Legacy 32-bit ARM | \`${ARMV7_SIZE}\` | \`${ARMV7_SHA}\` |
| \`${X86_STR}\` | 64-bit Intel/AMD Emulators | \`${X86_SIZE}\` | \`${X86_SHA}\` |
| \`tui.apk\` | In-App System Overrides | \`${TUI_SIZE}\` | \`${TUI_SHA}\` |

> 💡 **Notice on \`tui.apk\`:** This asset is structurally identical to the Universal layout, tailored explicitly for downstream dynamic validation routines executed via the \`tui -app_update\` module interface.
EOF

        # Dynamically append New Features & Bug Fixes only if fix-bug.md exists and is non-empty
        if [ -f "$CHANGELOG_PATH" ] && [ -s "$CHANGELOG_PATH" ]; then
          cat << 'EOF' >> ../../../../../body.md

---

### ✨ New Features & Bug Fixes
EOF
          cat "$CHANGELOG_PATH" >> ../../../../../body.md
        fi

        # Complete the trailing documentation elements
        cat << EOF >> ../../../../../body.md

---

### 📝 Changelog Summary

For full update details, granular diffs, and precise commit history, please review the automated deployment logs:
🔗 **[View Complete Commit History](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})**

---

### 📥 Deployment & Installation Guide

1.  **Identify Architecture:** Determine your device's CPU architecture using an info app or the universal installer.
2.  **Allow Unknown Sources:** Navigate to \`Settings\` > \`Security\` > \`Install Unknown Apps\` and enable permission for your browser/file manager.
3.  **Install:** Download the matching variant above and execute the package installer.
EOF

    - name: Create Release and Upload APKs
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        body_path: body.md
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
