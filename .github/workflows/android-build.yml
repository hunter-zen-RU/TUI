name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0

permissions:
  contents: write # Required for creating a release and uploading assets

jobs:
  Gradle-Build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Generate debug keystore for Android signing
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.workers.max=2 -PGITHUB_REF_NAME="${{ github.ref_name }}"

    - name: Create tui.apk copy from Universal APK
      run: |
        cd app/build/outputs/apk/release/
        UNIVERSAL_FILE=$(ls *universal*.apk | head -n 1)
        if [ -f "$UNIVERSAL_FILE" ]; then
          cp "$UNIVERSAL_FILE" tui.apk
          echo "Successfully copied $UNIVERSAL_FILE to tui.apk"
        else
          echo "Error: Universal APK not found!" && exit 1
        fi

    - name: Create Base Initial Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        body: "Automated compilation tracking initialization. Asset hashes and release notes are being structured dynamically..."
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
